<div class="auth-container">
  <div class="auth-card">
    <div class="auth-header">
      <h2>Rev<span>Shop</span></h2>
      <p>Welcome back! Please enter your details.</p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <div class="field">
        <label>Email Address</label>
        <input type="email" formControlName="email" placeholder="Enter your email">
      </div>

      <div class="field password-wrap">
        <label>Password</label>
        <input [type]="showPassword() ? 'text' : 'password'" 
               formControlName="password" 
               placeholder="••••••••">
        <button type="button" class="eye-toggle" (click)="togglePassword()">
          {{ showPassword() ? '🙈' : '👁️' }}
        </button>
      </div>

      <div class="options-row">
        <label class="checkbox-container">
          <input type="checkbox"> <span>Remember me</span>
        </label>
        <a href="javascript:void(0)" class="forgot-link">Forgot password?</a>
      </div>

      @if (errorMessage()) {
        <div class="error-msg">{{ errorMessage() }}</div>
      }

      <button type="submit" class="submit-btn" [disabled]="loginForm.invalid || isLoading()">
        {{ isLoading() ? 'Signing in...' : 'Sign In' }}
      </button>

      <p class="auth-footer">
        Don't have an account? <a routerLink="/register">Sign up for free</a>
      </p>
    </form>
  </div>
</div>
